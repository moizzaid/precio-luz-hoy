name: Test electricity data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run electricity data test
        run: python test_data.py
